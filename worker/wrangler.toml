name = "ddi"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# The Worker serves the built frontend as well as the API, so production is a single origin:
# no CORS preflights, no separate static host to keep in sync, and the OAuth `#token=` hand-off
# never crosses an origin boundary. Build the site (`npm run build` at the repo root) before
# `wrangler deploy` — this directory must exist at deploy time.
[assets]
directory = "../web/dist"

[[d1_databases]]
binding = "DB"
database_name = "ddi"
database_id = "46c32aba-f853-4436-b744-c8bc8b2e5084"

# Custom domain: wrangler creates the DNS record and certificate on deploy.
[[routes]]
pattern = "ddi.mulatram.dev"
custom_domain = true

[vars]
DDI_HALF_LIFE_HOURS = "8"
DDI_SCORE_ALPHA = "3"
DDI_K_MIN = "3"
DDI_VOTE_COOLDOWN_HOURS = "24"
DDI_MIN_GITHUB_AGE_DAYS = "90"
DDI_SESSION_TTL_DAYS = "30"
DDI_SNAPSHOT_BUCKET_MINUTES = "10"
DDI_SNAPSHOT_RETENTION_DAYS = "90"
DDI_SOFTMAX_TEMP = "10"
DDI_TURNSTILE_SITE_KEY = "0x4AAAAAAFgxnQfjTuKgEHrS"
DDI_WORKER_ORIGIN = "https://ddi.mulatram.dev"
DDI_WEB_ORIGIN = "https://ddi.mulatram.dev"
DDI_ALLOWED_ORIGINS = "https://ddi.mulatram.dev"
DDI_ADMIN_GITHUB_IDS = "249746087"

[triggers]
crons = ["*/10 * * * *"]
