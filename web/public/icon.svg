<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="DDI">
  <title>DDI</title>
  <defs>
    <linearGradient id="ddi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f6bff" />
      <stop offset="1" stop-color="#1a35c4" />
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect width="500" height="500" rx="112" fill="url(#ddi-bg)" />

  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Neutral axis: DDI 0 -->
    <path d="M108 250H392" stroke-width="12" opacity="0.34" />
    <!-- tanh compression: flat leads where the score saturates near +-100, steepest at the middle -->
    <path
      d="M92 382H156C198 382 206 250 250 250C294 250 302 118 344 118H408"
      stroke-width="42"
    />
  </g>
</svg>
