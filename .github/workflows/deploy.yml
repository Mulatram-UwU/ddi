name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Two pushes in quick succession must not race the same Worker + D1 pair.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # wrangler.toml `[assets]` points at web/dist, so the site has to exist before the deploy.
      - run: npm run build
      - name: Apply D1 migrations (remote)
        working-directory: worker
        run: npx wrangler d1 migrations apply ddi --remote
      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
